name: ElX temporary Go formatter

on:
  push:
    branches: [feat/elx-management-stage3]
    paths:
      - ".github/workflows/elx-autoformat-temp.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/elx-management-stage3
          persist-credentials: true
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Format only ElX-owned source files
        run: |
          go install mvdan.cc/gofumpt@v0.9.2
          "$(go env GOPATH)/bin/gofumpt" -w \
            internal/web/controller/elx_management.go \
            internal/web/controller/lk_proxy.go \
            internal/web/controller/elx_fup_proxy_test.go
          git diff --check
      - name: Commit formatter output to existing feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/web/controller/elx_management.go \
            internal/web/controller/lk_proxy.go \
            internal/web/controller/elx_fup_proxy_test.go
          if ! git diff --cached --quiet; then
            git commit -m "style(elx): apply gofumpt to Control bridge and LK adapters"
            git push origin HEAD:feat/elx-management-stage3
          fi
