name: ElX Control integration

on:
  push:
    branches: [elx-control-journal, feat/elx-management-stage3]
    paths:
      - "cmd/elx-control/**"
      - "internal/web/controller/elx_management*.go"
      - "internal/web/controller/lk*.go"
      - "frontend/lk.html"
      - "frontend/src/entries/lk.tsx"
      - "frontend/vite.config.js"
      - "frontend/src/api/elx-management.ts"
      - "frontend/src/pages/elx/**"
      - "frontend/src/test/elx-management.test.ts"
      - "frontend/src/routes/panelRoutes.tsx"
      - "internal/web/translation/**"
      - "internal/elxcontrol/**"
      - "scripts/elx-*.sh"
      - "scripts/elx-*.py"
      - "scripts/run-elx-windows.ps1"
      - ".github/workflows/elx-control-integration.yml"
      - "go.mod"
      - "go.sum"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: elx
          POSTGRES_PASSWORD: elx_ci_only
          POSTGRES_DB: elx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U elx -d elx_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout ElX-ui integration branch
        uses: actions/checkout@v5
        with:
          path: ElX-ui

      - name: Checkout ElXray integration branch
        uses: actions/checkout@v5
        with:
          repository: ElXnet/ElXray
          ref: restrict-runtime-unlimited
          path: ElXray

      - name: Setup Go toolchain
        uses: actions/setup-go@v6
        with:
          go-version-file: ElX-ui/go.mod
          cache: false

      - name: Check tooling and revisions
        run: |
          go version
          python3 --version
          gcc --version | head -1
          git -C ElX-ui rev-parse HEAD
          git -C ElXray rev-parse HEAD

      - name: Run race, PostgreSQL, policy and VLESS integration suite
        working-directory: ElX-ui
        env:
          ELX_CONTROL_POSTGRES_DSN: "host=127.0.0.1 port=5432 user=elx dbname=elx_test password=elx_ci_only sslmode=disable"
        run: bash scripts/elx-test-local.sh

  panel-and-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify Control / panel compile and authorization tests
        run: |
          go test ./internal/elxcontrol/management ./internal/elxcontrol/lk ./cmd/elx-control ./internal/web/controller -run 'TestManagement|TestLK|TestCheckAPIAuth|TestPanelUpdateRequiresNodeAdminScope' -count=1
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: Validate UI types and regression tests
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm test -- src/test/elx-management.test.ts
          npm run build
