name: ElX stage3 CI artifact formatting

on:
  push:
    branches: [feat/elx-management-stage3]
    paths:
      - ".github/workflows/elx-stage3-format-temp.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/elx-management-stage3
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Format Go changes
        run: |
          go install mvdan.cc/gofumpt@v0.9.2
          "$(go env GOPATH)/bin/gofumpt" -w \
            internal/web/controller/elx_management_test.go \
            internal/web/controller/lk_proxy.go \
            internal/web/web.go
      - name: Format frontend and regenerate committed API snapshot
        working-directory: frontend
        run: |
          npm ci
          npm run format
          npm run gen:api
      - name: Commit generated artifacts and formatting
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u internal/web/controller/elx_management_test.go \
            internal/web/controller/lk_proxy.go internal/web/web.go \
            frontend/src frontend/public/openapi.json
          if ! git diff --cached --quiet; then
            git commit -m "style(elx): apply project formatters and regenerate OpenAPI contract"
            git push origin HEAD:feat/elx-management-stage3
          fi
