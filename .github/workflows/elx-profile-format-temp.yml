name: ElX paid profile gofumpt

on:
  push:
    branches: [feat/elx-management-stage3]
    paths:
      - ".github/workflows/elx-profile-format-temp.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/elx-management-stage3
          persist-credentials: true
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Apply Go formatting
        run: |
          go install mvdan.cc/gofumpt@v0.9.2
          "$(go env GOPATH)/bin/gofumpt" -w \
            internal/web/job/elx_profile_job.go \
            internal/web/job/elx_profile_job_test.go
          git diff --check
      - name: Commit Go formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/web/job/elx_profile_job.go internal/web/job/elx_profile_job_test.go
          if ! git diff --cached --quiet; then
            git commit -m "style(provision): normalize paid-profile worker and tests"
            git push origin HEAD:feat/elx-management-stage3
          fi
